[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "skelton"
version = "0.1.0"
description = "Scientific research skeleton package"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyzmq>=27.1.0",
  "scipy>=1.13",
]

[dependency-groups]
dev = [
  "marimo>=0.11",
  "pytest>=8.0",
  "ruff>=0.8",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.py" = ["B018"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/sample"]
